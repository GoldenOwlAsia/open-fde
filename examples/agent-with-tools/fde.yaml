apiVersion: openfde.dev/v1alpha1
kind: Engagement
metadata:
  name: support-agent

spec:
  customer:
    name: example-saas

  objective:
    summary: Automate first-line support ticket resolution with an LLM agent

  successMetrics:
    - name: resolution_rate
      target: ">= 0.70"

  environment:
    cloud: aws
    regions: [ap-southeast-1]

  systems:
    # Declared read-only — but src/agent.ts contains an INSERT. `fde check`
    # flags the write-boundary violation with the exact file and line.
    - id: customer_db
      type: postgres
      access: read_only

  agents:
    - id: support_agent
      description: Answers tickets, holding tools against the customer database
      tools:
        - id: lookup_customer
          system: customer_db
          access: read_only
          containsPii: true
        # read_write against a read_only system → critical
        # agent-access-exceeds-boundary
        - id: record_resolution
          system: customer_db
          access: read_write
        # side-effecting with no humanApproval entry → critical
        # agent-side-effect-unapproved; and "payments" is not declared under
        # spec.systems → agent-tool-system-undeclared warning
        - id: issue_refund
          system: payments
          sideEffects: true

  constraints:
    dataResidency:
      allowedRegions: [ap-southeast-1]
    pii:
      allowExternalModel: true
    humanApproval:
      # Declared but empty: the agent has side-effecting ambitions and nobody
      # has decided what needs a human. `fde check` warns about this too.
      requiredFor: []

  reliability:
    timeout: 30s
    retry: exponential-backoff
    fallback: human-escalation

  evaluation:
    required: true
    suites:
      - name: ticket-regression
        type: regression
        location: evals/ticket-regression
        requiredBeforeDeploy: true
